<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Verse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        /* ── Header ── */
        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav { display: flex; gap: 4px; margin-left: auto; }
        nav a {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active {
            color: #e6edf3;
            background: #21262d;
            border-color: #30363d;
        }

        /* ── Refresh button ── */
        .date-badge {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.875rem;
            margin-left: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Top row: verse left, insight right ── */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid #21262d;
            animation: fadeIn 0.4s ease-out both;
        }

        .panel {
            padding: 48px 5vw;
        }

        /* ── Panel 1: Verse ── */
        .panel-verse {
            background: #0d1117;
            border-right: 1px solid #21262d;
        }

        .panel-verse .label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #f0883e;
            margin-bottom: 14px;
        }

        .panel-verse .verse-text {
            font-size: clamp(1.05rem, 1.8vw, 1.45rem);
            font-style: italic;
            line-height: 1.7;
            color: #e6edf3;
            position: relative;
            padding-left: 24px;
        }

        .panel-verse .verse-text::before {
            content: '\201C';
            position: absolute;
            left: -4px;
            top: -10px;
            font-size: 4rem;
            color: #f0883e;
            opacity: 0.35;
            font-style: normal;
            line-height: 1;
        }

        .panel-verse .verse-ref {
            margin-top: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f0883e;
            letter-spacing: 0.02em;
        }

        /* ── Panel 2: Insight ── */
        .panel-insight {
            background: #161b22;
        }

        .panel-insight .label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #58a6ff;
            margin-bottom: 14px;
        }

        .panel-insight .quote-text {
            font-size: clamp(0.9rem, 1.4vw, 1.1rem);
            line-height: 1.75;
            color: #c9d1d9;
            font-style: italic;
        }

        .panel-insight .attribution {
            margin-top: 16px;
            font-size: 0.875rem;
            color: #58a6ff;
            font-style: normal;
            font-weight: 500;
        }

        .panel-insight .attribution .work {
            color: #8b949e;
            font-style: italic;
            font-weight: 400;
        }

        /* ── Panel 3: Questions ── */
        .panel-questions {
            background: #0d1117;
            padding: 40px 5vw;
            animation: fadeIn 0.4s ease-out 0.15s both;
        }

        .panel-questions .label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #3fb950;
            margin-bottom: 16px;
        }

        .questions-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 900px) {
            .top-row { grid-template-columns: 1fr; }
            .panel-verse { border-right: none; border-bottom: 1px solid #21262d; }
            .questions-list { grid-template-columns: 1fr; }
        }

        .questions-list li {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 16px;
            font-size: clamp(0.875rem, 1.2vw, 1rem);
            line-height: 1.55;
            color: #c9d1d9;
            transition: border-color 0.15s;
        }

        .questions-list li:hover { border-color: #3fb950; }

        .questions-list .q-num {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1a4a1e;
            border: 1px solid #2ea043;
            color: #3fb950;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1px;
        }
    </style>
</head>
<body>

<header>
    <h1>&#9997; Daily Verse</h1>
    <nav>
        <a href="/">News</a>
        <a href="/google-trends.html">Google Trends</a>
        <a href="/trending.html">Trending</a>
        <a href="/wikipedia.html">Live Feed</a>
        <a href="/bluesky.html">Bluesky</a>
        <a href="/verse.html" class="active">Daily Verse</a>
    </nav>
    <span class="date-badge" id="date-badge"></span>
</header>

<div class="top-row">
    <!-- Panel 1: Verse -->
    <div class="panel panel-verse">
        <div class="label">&#128214; Today's Challenge</div>
        <div class="verse-text" id="verse-text"></div>
        <div class="verse-ref" id="verse-ref"></div>
    </div>

    <!-- Panel 2: Insight -->
    <div class="panel panel-insight">
        <div class="label">&#128161; Insight</div>
        <div class="quote-text" id="quote-text"></div>
        <div class="attribution" id="attribution"></div>
    </div>
</div>

<!-- Panel 3: Questions -->
<div class="panel panel-questions">
    <div class="label">&#9997; Apply It</div>
    <ol class="questions-list" id="questions-list"></ol>
</div>

<script>
    function render(entry) {
        // Verse panel
        document.getElementById('verse-text').textContent = entry.text;
        document.getElementById('verse-ref').textContent = `— ${entry.reference}  (${entry.version})`;

        // Insight panel
        document.getElementById('quote-text').textContent = entry.insight.quote;
        const attr = document.getElementById('attribution');
        attr.innerHTML = `${entry.insight.author} <span class="work">— ${entry.insight.work}</span>`;

        // Questions panel
        const list = document.getElementById('questions-list');
        list.innerHTML = '';
        entry.questions.forEach((q, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="q-num">${i + 1}</span><span>${q}</span>`;
            list.appendChild(li);
        });

        // Animate top row and questions in
        [document.querySelector('.top-row'), document.querySelector('.panel-questions')].forEach((el, i) => {
            el.style.animation = 'none';
            el.offsetHeight; // reflow
            el.style.animation = `fadeIn 0.4s ease-out ${i * 0.15}s both`;
        });
    }

    document.getElementById('date-badge').textContent =
        new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    fetch('/api/verse/today')
        .then(r => r.json())
        .then(render)
        .catch(() => {
            document.getElementById('verse-text').textContent = 'Could not load today\'s verse.';
        });
</script>
</body>
</html>
