<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live News Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        .dot.off { background: #f85149; animation: none; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

        nav { display: flex; gap: 4px; margin-left: auto; }
        nav a {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }
        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active { color: #e6edf3; border-color: #30363d; background: #21262d; }

        /* ── Ticker ── */
        .ticker-wrap {
            position: sticky;
            top: 57px;
            z-index: 199;
            background: #c0392b;
            overflow: hidden;
            height: 34px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #922b21;
        }

        .ticker-label {
            background: #922b21;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0 14px;
            height: 100%;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            border-right: 2px solid #7b241c;
            white-space: nowrap;
        }

        .ticker-scroll {
            flex: 1;
            overflow: hidden;
            height: 100%;
            position: relative;
        }

        .ticker-inner {
            display: inline-flex;
            align-items: center;
            height: 100%;
            white-space: nowrap;
            animation: ticker-move var(--ticker-duration, 80s) linear infinite;
            will-change: transform;
        }

        .ticker-inner:hover { animation-play-state: paused; }

        @keyframes ticker-move {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 0;
            font-size: 0.82rem;
            color: #fff;
            padding: 0 28px;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        .ticker-source {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-right: 8px;
            opacity: 0.8;
        }

        /* ── Filter bar ── */
        .filter-bar {
            position: sticky;
            top: 91px;
            z-index: 198;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .cat-btn:hover { color: #e6edf3; background: #30363d; }
        .cat-btn.active { color: #fff; border-color: transparent; }
        .cat-btn[data-cat="All"].active     { background: #1f6feb; }
        .cat-btn[data-cat="World"].active   { background: #1a4a1e; color: #3fb950; border-color: #2ea043; }
        .cat-btn[data-cat="Tech"].active    { background: #1c2d47; color: #79c0ff; border-color: #388bfd; }
        .cat-btn[data-cat="Science"].active { background: #2e1d5e; color: #bc8cff; border-color: #8957e5; }
        .cat-btn[data-cat="Politics"].active{ background: #3d2e00; color: #e3b341; border-color: #bb8009; }
        .cat-btn[data-cat="Business"].active{ background: #2a1d0e; color: #ffa657; border-color: #d1792a; }
        .cat-btn[data-cat="Sports"].active  { background: #3d1616; color: #f85149; border-color: #da3633; }

        .search-input {
            margin-left: auto;
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 0.8rem;
            width: 200px;
        }
        .search-input:focus { outline: 1px solid #58a6ff; border-color: #58a6ff; }

        /* ── Stats strip ── */
        .stats-strip {
            position: sticky;
            top: 141px;
            z-index: 197;
            background: #0d1117;
            border-bottom: 1px solid #21262d;
            padding: 6px 24px;
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            color: #484f58;
        }
        .stats-strip span { color: #8b949e; font-weight: 600; }

        /* ── Card grid ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
            padding: 20px 24px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .news-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeUp 0.3s ease-out both;
            transition: border-color 0.15s;
            cursor: pointer;
        }
        .news-card:hover { border-color: #58a6ff; }
        .news-card[data-cat="World"]    { border-left: 3px solid #2ea043; }
        .news-card[data-cat="Tech"]     { border-left: 3px solid #388bfd; }
        .news-card[data-cat="Science"]  { border-left: 3px solid #8957e5; }
        .news-card[data-cat="Politics"] { border-left: 3px solid #bb8009; }
        .news-card[data-cat="Business"] { border-left: 3px solid #d1792a; }
        .news-card[data-cat="Sports"]   { border-left: 3px solid #da3633; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-badge {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 7px;
            border-radius: 4px;
        }
        .badge-World    { background: #1a4a1e; color: #3fb950; }
        .badge-Tech     { background: #1c2d47; color: #79c0ff; }
        .badge-Science  { background: #2e1d5e; color: #bc8cff; }
        .badge-Politics { background: #3d2e00; color: #e3b341; }
        .badge-Business { background: #2a1d0e; color: #ffa657; }
        .badge-Sports   { background: #3d1616; color: #f85149; }

        .card-time {
            font-size: 0.72rem;
            color: #484f58;
            margin-left: auto;
            white-space: nowrap;
        }

        .card-title {
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .card-title a {
            color: #e6edf3;
            text-decoration: none;
        }
        .card-title a:hover { color: #58a6ff; }

        .card-desc {
            font-size: 0.78rem;
            color: #8b949e;
            line-height: 1.45;
        }

        .card-source-name {
            font-size: 0.72rem;
            color: #484f58;
        }

        #empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px;
            color: #484f58;
        }
        #empty-state h2 { font-size: 1rem; margin-bottom: 8px; color: #8b949e; }

        .new-badge {
            display: inline-block;
            background: #c0392b;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            vertical-align: middle;
            margin-left: 6px;
            animation: fadeBadge 8s forwards;
        }
        @keyframes fadeBadge {
            0%,70% { opacity: 1; }
            100%   { opacity: 0; }
        }

        @media (max-width: 640px) {
            .card-grid { grid-template-columns: 1fr; padding: 12px; }
            .filter-bar { gap: 6px; }
            .search-input { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>

<header>
    <h1>
        <div class="dot" id="dot"></div>
        Live News
    </h1>
    <nav>
        <a href="/" class="active">News</a>
        <a href="/google-trends.html">Google Trends</a>
        <a href="/wikipedia.html">Live Feed</a>
        <a href="/bluesky.html">Bluesky</a>
        <a href="/crypto.html">Crypto</a>
        <a href="/trends.html">Wiki Trends</a>
    </nav>
</header>

<div class="ticker-wrap">
    <div class="ticker-label">Breaking</div>
    <div class="ticker-scroll">
        <div class="ticker-inner" id="ticker">
            <span class="ticker-item"><span class="ticker-source">Loading</span>Connecting to news sources…</span>
            <span class="ticker-item"><span class="ticker-source">Loading</span>Connecting to news sources…</span>
        </div>
    </div>
</div>

<div class="filter-bar">
    <button class="cat-btn active" data-cat="All">All</button>
    <button class="cat-btn" data-cat="World">World</button>
    <button class="cat-btn" data-cat="Tech">Tech</button>
    <button class="cat-btn" data-cat="Science">Science</button>
    <button class="cat-btn" data-cat="Politics">Politics</button>
    <button class="cat-btn" data-cat="Business">Business</button>
    <button class="cat-btn" data-cat="Sports">Sports</button>
    <input class="search-input" type="text" id="search" placeholder="Search headlines…" autocomplete="off">
</div>

<div class="stats-strip">
    <div>Total: <span id="s-total">0</span></div>
    <div>Sources: <span id="s-sources">0</span></div>
    <div>New this session: <span id="s-new">0</span></div>
    <div>Status: <span id="s-status">Connecting…</span></div>
</div>

<div class="card-grid" id="grid">
    <div id="empty-state">
        <h2>Connecting to 24 news sources…</h2>
        <p>Headlines will appear here shortly</p>
    </div>
</div>

<script>
    const MAX_CARDS = 400;
    const TICKER_MAX = 40;

    let allItems  = [];       // { title, link, source, category, pubDate, description, ts }
    let tickerItems = [];     // last N headlines for ticker
    let activeCat = 'All';
    let searchKw  = '';
    let newCount  = 0;
    let seenLinks = new Set();
    let sources   = new Set();
    let initialLoad = true;   // suppress NEW badge for replayed cache items

    const grid     = document.getElementById('grid');
    const tickerEl = document.getElementById('ticker');
    const dot      = document.getElementById('dot');

    // ── Category colour helpers ─────────────────────────────────────────────
    function badgeClass(cat) { return 'badge-' + (cat || 'World'); }

    // ── Time formatting ─────────────────────────────────────────────────────
    function timeAgo(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d)) return '';
        const diff = (Date.now() - d) / 1000;
        if (diff < 60)   return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return Math.floor(diff / 86400) + 'd ago';
    }

    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Ticker ──────────────────────────────────────────────────────────────
    function rebuildTicker() {
        const items = tickerItems.slice(-TICKER_MAX);
        if (items.length === 0) return;

        const html = items.map(item =>
            `<span class="ticker-item"><span class="ticker-source">${esc(item.source)}</span>${esc(item.title)}</span>`
        ).join('');

        // Duplicate for seamless loop
        tickerEl.innerHTML = html + html;

        // Adjust speed based on content length (approx 12px per char at 0.82rem)
        const charCount = items.reduce((acc, i) => acc + i.title.length + i.source.length + 4, 0);
        const duration  = Math.max(40, Math.min(160, charCount * 0.18));
        tickerEl.style.setProperty('--ticker-duration', duration + 's');

        // Restart animation
        tickerEl.style.animation = 'none';
        tickerEl.offsetHeight; // reflow
        tickerEl.style.animation = '';
    }

    // ── Card creation ────────────────────────────────────────────────────────
    function createCard(item, isNew) {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.dataset.cat    = item.category || 'World';
        card.dataset.title  = (item.title || '').toLowerCase();
        card.dataset.source = (item.source || '').toLowerCase();

        const newBadge = isNew ? '<span class="new-badge">New</span>' : '';

        card.innerHTML = `
            <div class="card-meta">
                <span class="source-badge ${badgeClass(item.category)}">${esc(item.category)}</span>
                <span class="card-time">${timeAgo(item.pubDate)}</span>
            </div>
            <div class="card-title">
                <a href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.title)}${newBadge}</a>
            </div>
            ${item.description ? `<div class="card-desc">${esc(item.description)}</div>` : ''}
            <div class="card-source-name">${esc(item.source)}</div>
        `;
        return card;
    }

    // ── Filtering ────────────────────────────────────────────────────────────
    function matchesFilter(item) {
        if (activeCat !== 'All' && item.category !== activeCat) return false;
        if (searchKw) {
            const kw = searchKw.toLowerCase();
            if (!(item.title || '').toLowerCase().includes(kw) &&
                !(item.source || '').toLowerCase().includes(kw) &&
                !(item.description || '').toLowerCase().includes(kw)) return false;
        }
        return true;
    }

    // ── Full re-render (on filter change) ────────────────────────────────────
    function rerender() {
        grid.innerHTML = '';
        const visible = allItems.filter(matchesFilter).slice(0, MAX_CARDS);
        if (visible.length === 0) {
            grid.innerHTML = '<div id="empty-state"><h2>No matching stories</h2><p>Try a different filter</p></div>';
            return;
        }
        visible.forEach(item => grid.appendChild(createCard(item, false)));
    }

    // ── Add one item (from SSE) ──────────────────────────────────────────────
    function addItem(item, isNew) {
        if (seenLinks.has(item.link)) return;
        seenLinks.add(item.link);

        sources.add(item.source);
        allItems.unshift(item);
        if (allItems.length > MAX_CARDS * 2) allItems = allItems.slice(0, MAX_CARDS);

        tickerItems.push(item);
        if (tickerItems.length > TICKER_MAX) tickerItems.shift();

        if (isNew) {
            newCount++;
            document.getElementById('s-new').textContent = newCount;
            // Rebuild ticker every 5 new items to keep it fresh
            if (newCount % 5 === 0) rebuildTicker();
        }

        document.getElementById('s-total').textContent   = seenLinks.size;
        document.getElementById('s-sources').textContent = sources.size;

        // Only insert card if it matches the current filter
        if (!matchesFilter(item)) return;

        document.getElementById('empty-state')?.remove();

        const card = createCard(item, isNew);
        grid.insertBefore(card, grid.firstChild);

        // Trim DOM
        const cards = grid.querySelectorAll('.news-card');
        if (cards.length > MAX_CARDS) {
            for (let i = MAX_CARDS; i < cards.length; i++) cards[i].remove();
        }
    }

    // ── SSE connection ────────────────────────────────────────────────────────
    let eventSource = null;
    let batchBuffer = [];
    let batchTimer  = null;

    function flushBatch() {
        // Sort batch oldest-first so insertion order is chronological
        batchBuffer.sort((a, b) => new Date(a.pubDate) - new Date(b.pubDate));
        batchBuffer.forEach(item => addItem(item, !initialLoad));
        batchBuffer = [];
        if (initialLoad) {
            initialLoad = false;
            rebuildTicker();
        }
    }

    function connect() {
        if (eventSource) eventSource.close();
        initialLoad = true;

        eventSource = new EventSource('/stream/news');

        eventSource.addEventListener('news', e => {
            try {
                const item = JSON.parse(e.data);
                batchBuffer.push(item);
                clearTimeout(batchTimer);
                // Flush after 200ms quiet period (batch the initial cache replay)
                batchTimer = setTimeout(flushBatch, 200);
            } catch (err) {
                console.error(err);
            }
        });

        eventSource.onopen  = () => {
            dot.className = 'dot';
            document.getElementById('s-status').textContent = 'Live';
        };
        eventSource.onerror = () => {
            dot.className = 'dot off';
            document.getElementById('s-status').textContent = 'Reconnecting…';
        };
    }

    // ── Controls ──────────────────────────────────────────────────────────────
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCat = btn.dataset.cat;
            rerender();
        });
    });

    document.getElementById('search').addEventListener('input', e => {
        searchKw = e.target.value.trim();
        rerender();
    });

    // Update time-ago labels every minute
    setInterval(() => {
        grid.querySelectorAll('.card-time').forEach((el, i) => {
            const item = allItems.filter(matchesFilter)[i];
            if (item) el.textContent = timeAgo(item.pubDate);
        });
    }, 60000);

    connect();
</script>
</body>
</html>
