<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X / Twitter Trends</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }

        /* ── Header / Nav ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .x-logo {
            width: 24px;
            height: 24px;
            background: #e6edf3;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 900;
            color: #0d1117;
            flex-shrink: 0;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -1px;
        }

        nav { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
        nav a {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }
        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active { color: #e6edf3; border-color: #30363d; background: #21262d; }

        /* ── Controls bar ── */
        .controls-bar {
            position: sticky;
            top: 57px;
            z-index: 99;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 600;
        }

        select {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.875rem;
            cursor: pointer;
        }
        select:focus { outline: 1px solid #1d9bf0; border-color: #1d9bf0; }

        .updated-label {
            font-size: 0.75rem;
            color: #484f58;
            margin-left: auto;
        }
        .updated-label span { color: #8b949e; }

        /* ── Trends list ── */
        .trends-list {
            max-width: 960px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        /* ── Word cloud ── */
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px 20px;
            line-height: 1.3;
        }

        .cloud-word {
            color: #1d9bf0;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.15s, transform 0.15s;
            white-space: nowrap;
            display: inline-block;
        }
        .cloud-word:hover {
            color: #fff;
            transform: scale(1.12);
        }
        .cloud-word.rank-top   { color: #ffffff; }
        .cloud-word.rank-high  { color: #7dd3fc; }
        .cloud-word.rank-mid   { color: #1d9bf0; }
        .cloud-word.rank-low   { color: #0e5a82; }

        /* ── Empty / loading ── */
        #loading {
            text-align: center;
            padding: 80px 20px;
            color: #484f58;
        }
        #loading h2 { font-size: 1rem; margin-bottom: 8px; color: #8b949e; }

        .dot-pulse {
            display: inline-flex;
            gap: 5px;
            margin-top: 12px;
        }
        .dot-pulse span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #1d9bf0;
            animation: dp 1.2s ease-in-out infinite;
        }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        .dot-pulse span:nth-child(4) { animation-delay: 0.6s; opacity: 0.5; }
        @keyframes dp { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

        .source-note {
            text-align: center;
            font-size: 0.72rem;
            color: #484f58;
            padding: 12px 24px 0;
        }
        .source-note a { color: #484f58; }
        .source-note a:hover { color: #8b949e; }

        @media (max-width: 768px) {
            header { flex-wrap: wrap; gap: 8px 16px; padding: 12px 16px; }
            nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
            nav::-webkit-scrollbar { display: none; }
            nav a { font-size: 0.8rem; padding: 5px 10px; }
        }
        @media (max-width: 640px) {
            .trends-list { padding: 12px 12px 60px; }
            .trend-rank { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>
        <div class="x-logo">X</div>
        Trending
    </h1>
    <nav>
        <a href="/">News</a>
        <a href="/google-trends.html">Google Trends</a>
        <a href="/trending.html">Trending</a>
        <a href="/twitter-trends.html" class="active">X Trends</a>
        <a href="/wikipedia.html">Live Feed</a>
        <a href="/bluesky.html">Bluesky</a>
        <a id="nav-verse" href="/verse.html" style="display:none">Daily Verse</a>
    </nav>
</header>

<div class="controls-bar">
    <div class="page-title">Trending on X</div>
    <select id="country-select">
        <option value="worldwide">Worldwide</option>
        <option value="united-states">United States</option>
        <option value="united-kingdom">United Kingdom</option>
        <option value="australia" selected>Australia</option>
        <option value="canada">Canada</option>
        <option value="india">India</option>
        <option value="germany">Germany</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
        <option value="brazil">Brazil</option>
        <option value="mexico">Mexico</option>
        <option value="south-korea">South Korea</option>
        <option value="spain">Spain</option>
        <option value="italy">Italy</option>
        <option value="indonesia">Indonesia</option>
        <option value="argentina">Argentina</option>
        <option value="turkey">Turkey</option>
        <option value="nigeria">Nigeria</option>
        <option value="south-africa">South Africa</option>
    </select>
    <div class="updated-label">Updated: <span id="update-time">—</span></div>
</div>

<div class="trends-list" id="trends-list">
    <div id="loading">
        <h2>Fetching trending topics…</h2>
        <div class="dot-pulse"><span></span><span></span><span></span><span></span></div>
    </div>
</div>
<div class="source-note">Data via <a href="https://trends24.in" target="_blank" rel="noopener">trends24.in</a> · refreshes every 15 min</div>

<script>
    const listEl      = document.getElementById('trends-list');
    const countrySelect = document.getElementById('country-select');
    const updateTime  = document.getElementById('update-time');

    let refreshTimer = null;

    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render(trends) {
        if (!trends || trends.length === 0) {
            listEl.innerHTML = '<div id="loading"><h2>No trends available for this region.</h2></div>';
            return;
        }

        const total = trends.length;
        // Font size: 3rem for rank 1, scaling down to 0.9rem at the bottom
        function fontSize(i) {
            const t = 1 - (i / (total - 1 || 1));
            return (0.9 + t * 2.2).toFixed(2);
        }
        function rankClass(i) {
            if (i < 3)            return 'rank-top';
            if (i < Math.ceil(total * 0.25)) return 'rank-high';
            if (i < Math.ceil(total * 0.60)) return 'rank-mid';
            return 'rank-low';
        }

        const words = trends.map((t, i) => {
            const title = t.postCount ? `${esc(t.name)} · ${esc(t.postCount)}` : esc(t.name);
            return `<a class="cloud-word ${rankClass(i)}"
                       href="${esc(t.searchUrl)}"
                       target="_blank" rel="noopener"
                       style="font-size:${fontSize(i)}rem"
                       title="${title}">${esc(t.name)}</a>`;
        });

        // Shuffle slightly so it doesn't look like a straight sorted list
        for (let i = words.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            if (Math.abs(i - j) > 3) [words[i], words[j]] = [words[j], words[i]];
        }

        listEl.innerHTML = `<div class="word-cloud">${words.join('')}</div>`;
        updateTime.textContent = new Date().toLocaleTimeString();
    }

    // ── Fetch ────────────────────────────────────────────────────────────────
    function load(country) {
        listEl.innerHTML = '<div id="loading"><h2>Fetching trending topics…</h2><div class="dot-pulse"><span></span><span></span><span></span><span></span></div></div>';

        fetch(`/api/twitter/trends?country=${encodeURIComponent(country)}`)
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(render)
            .catch(() => {
                listEl.innerHTML = '<div id="loading"><h2>Could not load trends — try again shortly.</h2></div>';
            });
    }

    function scheduleRefresh(country) {
        clearTimeout(refreshTimer);
        // Auto-refresh every 15 minutes (trends update hourly)
        refreshTimer = setTimeout(() => {
            load(country);
            scheduleRefresh(country);
        }, 15 * 60 * 1000);
    }

    countrySelect.addEventListener('change', () => {
        const country = countrySelect.value;
        load(country);
        scheduleRefresh(country);
    });

    window.addEventListener('beforeunload', () => clearTimeout(refreshTimer));

    const initial = countrySelect.value;
    load(initial);
    scheduleRefresh(initial);
</script>
<script>
(function(){
    if (new URLSearchParams(location.search).get('bible') === 'true')
        sessionStorage.setItem('bibleEnabled', 'true');
    var el = document.getElementById('nav-verse');
    if (el && sessionStorage.getItem('bibleEnabled') === 'true') el.style.display = '';
})();
</script>
</body>
</html>
