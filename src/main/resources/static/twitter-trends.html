<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X / Twitter Trends</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }

        /* ── Header / Nav ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .x-logo {
            width: 24px;
            height: 24px;
            background: #e6edf3;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 900;
            color: #0d1117;
            flex-shrink: 0;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -1px;
        }

        nav { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
        nav a {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.875rem;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }
        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active { color: #e6edf3; border-color: #30363d; background: #21262d; }

        /* ── Controls bar ── */
        .controls-bar {
            position: sticky;
            top: 57px;
            z-index: 99;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 600;
        }

        select {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.875rem;
            cursor: pointer;
        }
        select:focus { outline: 1px solid #1d9bf0; border-color: #1d9bf0; }

        .updated-label {
            font-size: 0.75rem;
            color: #484f58;
            margin-left: auto;
        }
        .updated-label span { color: #8b949e; }

        /* ── Trends list ── */
        .trends-list {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 24px 60px;
        }

        /* ── Single trend row ── */
        .trend-row {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 14px 12px;
            border-radius: 8px;
            transition: background 0.15s;
            border-bottom: 1px solid #21262d;
            min-width: 0;
        }
        .trend-row:last-child { border-bottom: none; }
        .trend-row:hover { background: #161b22; }

        .trend-rank {
            font-size: 1.5rem;
            font-weight: 700;
            color: #30363d;
            text-align: right;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .trend-body { overflow: hidden; min-width: 0; }

        .trend-name {
            font-size: 1rem;
            font-weight: 700;
            color: #e6edf3;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            transition: color 0.15s;
        }
        .trend-name:hover { color: #1d9bf0; }

        .trend-bar-wrap {
            height: 3px;
            background: #21262d;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .trend-bar-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #1d9bf0, #0ea5e9);
            transition: width 0.6s ease;
        }

        .post-count {
            font-size: 0.72rem;
            font-weight: 600;
            color: #1d9bf0;
            background: rgba(29,155,240,0.1);
            border: 1px solid rgba(29,155,240,0.25);
            border-radius: 10px;
            padding: 2px 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Empty / loading ── */
        #loading {
            text-align: center;
            padding: 80px 20px;
            color: #484f58;
        }
        #loading h2 { font-size: 1rem; margin-bottom: 8px; color: #8b949e; }

        .dot-pulse {
            display: inline-flex;
            gap: 5px;
            margin-top: 12px;
        }
        .dot-pulse span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #1d9bf0;
            animation: dp 1.2s ease-in-out infinite;
        }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        .dot-pulse span:nth-child(4) { animation-delay: 0.6s; opacity: 0.5; }
        @keyframes dp { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

        .source-note {
            text-align: center;
            font-size: 0.72rem;
            color: #484f58;
            padding: 12px 24px 0;
        }
        .source-note a { color: #484f58; }
        .source-note a:hover { color: #8b949e; }

        @media (max-width: 768px) {
            header { flex-wrap: wrap; gap: 8px 16px; padding: 12px 16px; }
            nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
            nav::-webkit-scrollbar { display: none; }
            nav a { font-size: 0.8rem; padding: 5px 10px; }
        }
        @media (max-width: 640px) {
            .trends-list { padding: 12px 12px 60px; }
            .trend-rank { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>
        <div class="x-logo">X</div>
        Trending
    </h1>
    <nav>
        <a href="/">News</a>
        <a href="/google-trends.html">Google Trends</a>
        <a href="/trending.html">Trending</a>
        <a href="/twitter-trends.html" class="active">X Trends</a>
        <a href="/wikipedia.html">Live Feed</a>
        <a href="/bluesky.html">Bluesky</a>
        <a href="/verse.html">Daily Verse</a>
    </nav>
</header>

<div class="controls-bar">
    <div class="page-title">Trending on X</div>
    <select id="country-select">
        <option value="worldwide">Worldwide</option>
        <option value="united-states">United States</option>
        <option value="united-kingdom">United Kingdom</option>
        <option value="australia" selected>Australia</option>
        <option value="canada">Canada</option>
        <option value="india">India</option>
        <option value="germany">Germany</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
        <option value="brazil">Brazil</option>
        <option value="mexico">Mexico</option>
        <option value="south-korea">South Korea</option>
        <option value="spain">Spain</option>
        <option value="italy">Italy</option>
        <option value="indonesia">Indonesia</option>
        <option value="argentina">Argentina</option>
        <option value="turkey">Turkey</option>
        <option value="nigeria">Nigeria</option>
        <option value="south-africa">South Africa</option>
    </select>
    <div class="updated-label">Updated: <span id="update-time">—</span></div>
</div>

<div class="trends-list" id="trends-list">
    <div id="loading">
        <h2>Fetching trending topics…</h2>
        <div class="dot-pulse"><span></span><span></span><span></span><span></span></div>
    </div>
</div>
<div class="source-note">Data via <a href="https://trends24.in" target="_blank" rel="noopener">trends24.in</a> · refreshes every 15 min</div>

<script>
    const listEl      = document.getElementById('trends-list');
    const countrySelect = document.getElementById('country-select');
    const updateTime  = document.getElementById('update-time');

    let refreshTimer = null;

    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render(trends) {
        if (!trends || trends.length === 0) {
            listEl.innerHTML = '<div id="loading"><h2>No trends available for this region.</h2></div>';
            return;
        }

        listEl.innerHTML = trends.map((t, i) => {
            // Use post count as bar width proxy — approximate by rank (inverse)
            const pct = Math.round(((trends.length - i) / trends.length) * 100);

            return `
            <div class="trend-row">
                <div class="trend-rank">${i + 1}</div>
                <div class="trend-body">
                    <a class="trend-name"
                       href="${esc(t.searchUrl)}"
                       target="_blank" rel="noopener">${esc(t.name)}</a>
                    <div class="trend-bar-wrap">
                        <div class="trend-bar-fill" style="width:${pct}%"></div>
                    </div>
                </div>
                ${t.postCount
                    ? `<span class="post-count">${esc(t.postCount)}</span>`
                    : '<span></span>'}
            </div>`;
        }).join('');

        updateTime.textContent = new Date().toLocaleTimeString();
    }

    // ── Fetch ────────────────────────────────────────────────────────────────
    function load(country) {
        listEl.innerHTML = '<div id="loading"><h2>Fetching trending topics…</h2><div class="dot-pulse"><span></span><span></span><span></span><span></span></div></div>';

        fetch(`/api/twitter/trends?country=${encodeURIComponent(country)}`)
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(render)
            .catch(() => {
                listEl.innerHTML = '<div id="loading"><h2>Could not load trends — try again shortly.</h2></div>';
            });
    }

    function scheduleRefresh(country) {
        clearTimeout(refreshTimer);
        // Auto-refresh every 15 minutes (trends update hourly)
        refreshTimer = setTimeout(() => {
            load(country);
            scheduleRefresh(country);
        }, 15 * 60 * 1000);
    }

    countrySelect.addEventListener('change', () => {
        const country = countrySelect.value;
        load(country);
        scheduleRefresh(country);
    });

    window.addEventListener('beforeunload', () => clearTimeout(refreshTimer));

    const initial = countrySelect.value;
    load(initial);
    scheduleRefresh(initial);
</script>
</body>
</html>
